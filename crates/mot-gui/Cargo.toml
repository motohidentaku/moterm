[package]
name = "mot-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "moterm GUI（winit + softbuffer + fontdue の CPU 描画）"

[[bin]]
name = "moterm"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
unicode-width = { workspace = true }
dirs = { workspace = true }
serde_json = { workspace = true }
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"
fontdb = "0.23"
arboard = { version = "3", default-features = false }
notify = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
russh = "0.59"
# NEO-UI 描画基盤: 純Rust CPU 2Dラスタライザ（角丸/グラデ/グロー/α合成/AA）。
# png-format は不要（スクショは image クレート）なので外して軽量化。
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
mot-term = { path = "../mot-term" }
mot-core = { path = "../mot-core" }
mot-ssh = { path = "../mot-ssh" }

# Windows: DWM にウィンドウ角丸を要求する（Win11。Win10以前は no-op）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem"] }

# ビルド時: Windows exe へアイコンを埋め込む（assets/icon.png → .ico）。
# Linux/macOS ターゲットでは build.rs が no-op になる（依存は host 用にコンパイルされるだけ）。
[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.4"
winresource = "0.1"
