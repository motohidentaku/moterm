[package]
name = "mot-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "設定(Lua)・profiles.json・ランチャーモデル・暗号ボールト・ppk変換・i18n"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
rand = "0.8"
thiserror = "1"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "rsa", "alloc", "std"] }
